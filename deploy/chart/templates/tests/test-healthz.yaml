apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-healthz
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["curl", "-fsS", "--retry", "5", "--retry-connrefused", "http://{{ .Release.Name }}:{{ .Values.service.port }}/healthz"]
